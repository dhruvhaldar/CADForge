[project]
name = "cadforge"
version = "0.1.0"
description = "Local parametric CAD workbench"
requires-python = ">=3.13,<3.14"
dependencies = ["nicegui==3.17.0", "build123d==0.11.1", "platformdirs>=4,<5"]

[project.scripts]
cadforge = "cadforge.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: requires a running CADForge server and Chromium"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
